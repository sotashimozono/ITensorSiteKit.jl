name: CI
on:
  push:
    branches: [main]
    tags: '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# One caller into the org's reusable, like every other workflow here. The sharded-test vertical
# is QAtlasHub/TestShards.jl; `julia-testshards.yml` wraps it because the Codecov upload has to
# happen where a PRIVATE repo's secret can reach, which is inside this organisation.
#
# `contents: write` is NOT optional: a called workflow's jobs may not request more permission
# than the caller granted, the timing history is pushed to a `ci-timings` orphan branch, and
# granting less makes the run fail to START with no log to read.
jobs:
  ci:
    permissions:
      contents: write
    uses: lab-sotashimozono/.github/.github/workflows/julia-testshards.yml@main
    with:
      # The diagnosis printed on every run names the knee for this suite. Set what it says.
      shards: 2
      # HOSTED runners: this repository is PUBLIC and the self-hosted pool refuses
      # public-repository jobs, so the wrapper's private-repo defaults must be overridden.
      runner: '"ubuntu-latest"'
      helper-runner: '"ubuntu-latest"'
      # Not everything here comes from General. This also REFRESHES: a registry that is
      # present but stale resolves fine while failing to see anything published since it
      # was last pulled, and on a persistent depot that is the common case.
      registries: |
        General
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
